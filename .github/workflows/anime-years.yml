name: anime-years
# Sakugabooru 작품 태그 → 방영 연도 표 (작화 필터 › 시대). 매달 1일, 또는 스크립트를 고치면 다시 만듦
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
  push:
    branches: [main]
    paths: ['tools/anime-years.mjs', '.github/workflows/anime-years.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/anime-years.mjs
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/anime-years.json
          git diff --cached --quiet || (git commit -m "작화 시대 표 갱신" && git pull --rebase && git push)
