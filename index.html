<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>컷 레퍼런스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1c1c;--panel:#232323;--line:#333;--line2:#444;--tx:#d8d8d8;--tx2:#8a8a8a;--tx3:#5e5e5e;--acc:#e6e6e6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace}
a{color:var(--tx2)}
button,select,input{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line2);border-radius:3px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#666}
button.on{background:var(--acc);color:#111;border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
select,input[type=number],input[type=text]{background:var(--panel);border:1px solid var(--line2);border-radius:3px;padding:4px 6px}
input[type=number]{width:46px}
input[type=range]{accent-color:#aaa;width:70px}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:13px;font-weight:600}
.tabs{display:flex}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;padding:6px 12px;color:var(--tx2)}
.tabs button.on{background:none;color:var(--tx);border-bottom-color:var(--tx)}
.sp{flex:1}
.src{display:flex;align-items:center;gap:8px;color:var(--tx2)}
.src label{display:flex;align-items:center;gap:5px;cursor:pointer}
#stage{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}
#img,#vid{max-width:100%;max-height:100%;display:block;user-select:none;-webkit-user-drag:none}
.flip{transform:scaleX(-1)}
#ov{position:absolute;pointer-events:none}
#msg{text-align:center;color:var(--tx2);line-height:1.9;max-width:460px;padding:0 20px}
#msg b{color:var(--tx);font-weight:500}
#info{position:absolute;left:14px;top:10px;font-size:11px;color:var(--tx3);display:flex;gap:10px;align-items:center}
#info a{color:var(--tx2);text-decoration:none;border-bottom:1px solid var(--line2)}
#timerBig{position:absolute;right:14px;top:8px;color:var(--tx2);font-size:13px}
#load{position:absolute;right:14px;bottom:10px;color:var(--tx3);font-size:11px}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-top:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:6px}
.grp>label{color:var(--tx3);font-size:11px;margin-right:2px}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg button:last-child{border-radius:0 3px 3px 0}
#next{padding:7px 18px;font-weight:500;border-color:#777}
.keys{color:var(--tx3);font-size:11px}
.hidden{display:none!important}
#setDlg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:9}
#setDlg .box{background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:18px;width:min(440px,92vw);line-height:1.7}
#setDlg .box h2{font-size:13px;font-weight:600;margin-bottom:8px}
#setDlg .box p{color:var(--tx2);font-size:12px;margin-bottom:10px}
#setDlg input{width:100%;margin-bottom:12px}
body.zen header,body.zen footer{display:none}
body.zen #app{grid-template-rows:0 1fr 0}
body.zen #info{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="t2"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="discrete" tableValues="0.12 0.85"/><feFuncG type="discrete" tableValues="0.12 0.85"/><feFuncB type="discrete" tableValues="0.12 0.85"/></feComponentTransfer></filter>
  <filter id="t3"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="discrete" tableValues="0.1 0.5 0.9"/><feFuncG type="discrete" tableValues="0.1 0.5 0.9"/><feFuncB type="discrete" tableValues="0.1 0.5 0.9"/></feComponentTransfer></filter>
  <filter id="t5"><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="discrete" tableValues="0.05 0.3 0.5 0.7 0.95"/><feFuncG type="discrete" tableValues="0.05 0.3 0.5 0.7 0.95"/><feFuncB type="discrete" tableValues="0.05 0.3 0.5 0.7 0.95"/></feComponentTransfer></filter>
</svg>

<div id="app">
<header>
  <h1>컷 레퍼런스</h1>
  <nav class="tabs">
    <button data-tab="film" class="on">영화</button>
    <button data-tab="anim">애니메이션 레이아웃</button>
  </nav>
  <div class="sp"></div>
  <div class="src" id="srcFilm">
    <span class="mono">FILM-GRAB</span>
    <label><input type="checkbox" id="onlyAnim"> 애니메이션 영화만</label>
  </div>
  <div class="src hidden" id="srcAnim">
    <span class="mono">SAKUGABOORU</span>
    <input type="text" id="tags" placeholder="태그 (예: effects, character_acting)" style="width:220px">
    <label><input type="checkbox" id="play"> 영상 재생</label>
  </div>
  <button id="setBtn">설정</button>
</header>

<main id="stage">
  <div id="msg"><b>불러오는 중</b></div>
  <img id="img" class="hidden" alt="" referrerpolicy="no-referrer">
  <video id="vid" class="hidden" muted playsinline loop preload="auto" referrerpolicy="no-referrer"></video>
  <svg id="ov"></svg>
  <div id="info" class="mono"></div>
  <div id="timerBig" class="mono"></div>
  <div id="load" class="mono"></div>
</main>

<footer>
  <div class="grp">
    <button id="prev">← 이전</button>
    <button id="next">다음 컷 →</button>
  </div>
  <div class="grp"><label>색</label>
    <div class="seg" id="tone">
      <button data-v="color" class="on">컬러</button>
      <button data-v="gray">흑백</button>
      <button data-v="t2">2톤</button>
      <button data-v="t3">3톤</button>
      <button data-v="t5">5톤</button>
    </div>
  </div>
  <div class="grp"><label>분할</label>
    <select id="grid">
      <option value="none">없음</option>
      <option value="half">2분할</option>
      <option value="thirds">3분할</option>
      <option value="quarters">4분할</option>
      <option value="golden">황금비</option>
      <option value="diag">대각선</option>
      <option value="custom">사용자 N×M</option>
      <option value="field">필드 가이드</option>
      <option value="safe">세이프 영역</option>
    </select>
    <span id="customBox" class="hidden"><input id="gc" type="number" min="1" max="24" value="4"> × <input id="gr" type="number" min="1" max="24" value="4"></span>
    <div class="seg" id="lc">
      <button data-v="#ffffff" class="on">흰</button>
      <button data-v="#000000">검</button>
      <button data-v="#ff3b30">빨</button>
    </div>
    <input id="op" type="range" min="15" max="100" value="60" title="선 불투명도">
  </div>
  <div class="grp"><label>보기</label>
    <button id="flip">좌우반전</button>
    <button id="zen">UI 숨김</button>
  </div>
  <div class="grp"><label>타이머</label>
    <select id="timer">
      <option value="0">끔</option><option value="30">30초</option><option value="60">1분</option>
      <option value="120">2분</option><option value="300">5분</option><option value="600">10분</option>
    </select>
  </div>
  <div class="sp"></div>
  <span class="keys">Space/→ 다음 · ← 이전 · G 색 · D 분할 · F 반전 · H 숨김 · , . 프레임</span>
</footer>
</div>

<div id="setDlg" class="hidden"><div class="box">
  <h2>연결 설정</h2>
  <p>브라우저가 외부 사이트 요청을 막으면(CORS) 프록시 주소를 넣음. 요청 URL 앞에 그대로 붙음. 비워두면 직접 연결.</p>
  <input type="text" id="proxy" placeholder="예: https://내-프록시.workers.dev/?url=">
  <p>이미지는 각 사이트 원본에서 직접 표시됨. 저장·재배포 없음.</p>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button id="setClose">닫기</button></div>
</div></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const FG='https://film-grab.com/wp-json/wp/v2/';
const SB='https://www.sakugabooru.com/';
const S={tab:'film',tone:'color',lc:'#ffffff',op:60,flip:false,timer:0,onlyAnim:false,tags:'',play:false,proxy:'',
  grid:{film:'thirds',anim:'field'},hist:{film:[],anim:[]},pos:{film:-1,anim:-1},seen:{film:new Set(),anim:new Set()},queue:{film:[],anim:[]}};
try{const p=JSON.parse(localStorage.getItem('cutref2')||'{}');for(const k of['tab','tone','lc','op','timer','onlyAnim','tags','play','proxy','grid'])if(p[k]!==undefined)S[k]=p[k]}catch(e){}
const save=()=>{try{localStorage.setItem('cutref2',JSON.stringify({tab:S.tab,tone:S.tone,lc:S.lc,op:S.op,timer:S.timer,onlyAnim:S.onlyAnim,tags:S.tags,play:S.play,proxy:S.proxy,grid:S.grid}))}catch(e){}};

const P=u=>S.proxy?S.proxy+encodeURIComponent(u):u;
async function getJSON(u){const r=await fetch(P(u),{credentials:'omit'});if(!r.ok)throw new Error('HTTP '+r.status);return {data:await r.json(),headers:r.headers}}
const rnd=n=>Math.floor(Math.random()*n);
const abs=u=>!u?u:u.startsWith('//')?'https:'+u:u.startsWith('/')?SB.replace(/\/$/,'')+u:u;

// ---------- FILM-GRAB (WordPress REST)
const fg={total:{},animCat:undefined};
async function fgAnimCat(){
  if(fg.animCat!==undefined)return fg.animCat;
  try{const {data}=await getJSON(FG+'categories?search=animation&per_page=20&_fields=id,name,slug');
    const c=data.find(x=>/^animation$/i.test(x.slug)||/^animation$/i.test(x.name))||data[0];fg.animCat=c?c.id:null}catch(e){fg.animCat=null}
  return fg.animCat;
}
function pickImages(html){
  const d=new DOMParser().parseFromString(html,'text/html');const out=new Set();
  d.querySelectorAll('a[href]').forEach(a=>{if(/\.(jpe?g|png|webp)(\?|$)/i.test(a.href))out.add(a.getAttribute('href'))});
  if(!out.size)d.querySelectorAll('img').forEach(i=>{
    const ss=i.getAttribute('srcset');
    if(ss){const best=ss.split(',').map(s=>s.trim().split(/\s+/)).sort((a,b)=>parseInt(b[1])-parseInt(a[1]))[0];if(best)out.add(best[0])}
    else{const s=i.getAttribute('data-src')||i.getAttribute('src');if(s)out.add(s)}});
  return [...out];
}
async function fgRandom(){
  const cat=S.onlyAnim?await fgAnimCat():null;
  if(S.onlyAnim&&!cat)throw new Error('애니메이션 분류를 찾지 못함');
  const key=cat||'all',q=cat?`&categories=${cat}`:'';
  if(!fg.total[key]){const {headers}=await getJSON(FG+`posts?per_page=1&_fields=id${q}`);
    fg.total[key]=parseInt(headers.get('X-WP-Total'))||1000}
  for(let tries=0;tries<4;tries++){
    const page=1+rnd(fg.total[key]);
    let data;try{({data}=await getJSON(FG+`posts?per_page=1&page=${page}&_fields=id,link,title,content${q}`))}catch(e){if(tries<3)continue;throw e}
    const p=data[0];if(!p)continue;
    const imgs=pickImages(p.content.rendered).filter(u=>!S.seen.film.has(u));
    if(!imgs.length)continue;
    const url=imgs[rnd(imgs.length)];
    const t=new DOMParser().parseFromString(p.title.rendered,'text/html').body.textContent;
    return {kind:'img',url,title:t,link:p.link,key:url};
  }
  throw new Error('이미지를 찾지 못함');
}

// ---------- SAKUGABOORU (Moebooru API)
async function sbRandom(){
  const tags=['order:random','rating:s',...S.tags.trim().split(/\s+/).filter(Boolean)].join(' ');
  const {data}=await getJSON(SB+`post.json?limit=8&tags=${encodeURIComponent(tags)}`);
  const list=data.filter(p=>p.file_url&&!S.seen.anim.has(p.id));
  if(!list.length)throw new Error('결과 없음 (태그 확인)');
  const p=list[0];const ext=(p.file_ext||p.file_url.split('.').pop()).toLowerCase();
  const tagStr=(p.tags||'').split(' ').slice(0,4).join(' ');
  return {kind:/mp4|webm|mov/.test(ext)?'vid':'img',url:abs(p.file_url),title:`#${p.id} ${tagStr}`,link:SB+'post/show/'+p.id,key:p.id};
}

// ---------- queue / prefetch
const fetching={film:false,anim:false};
async function fill(tab){
  if(fetching[tab])return;fetching[tab]=true;
  try{while(S.queue[tab].length<2){const it=await(tab==='film'?fgRandom():sbRandom());
    S.seen[tab].add(it.key);if(it.kind==='img'){const pre=new Image();pre.referrerPolicy='no-referrer';pre.src=it.url}
    S.queue[tab].push(it)}}
  catch(e){lastErr[tab]=e.message}finally{fetching[tab]=false}
}
const lastErr={film:'',anim:''};
async function next(){const t=S.tab;
  if(S.pos[t]<S.hist[t].length-1){S.pos[t]++;show();return}
  if(!S.queue[t].length){setLoad('불러오는 중…');lastErr[t]='';await fill(t);
    if(!S.queue[t].length){setLoad('');return showErr(lastErr[t]||'불러오기 실패')}}
  S.hist[t].push(S.queue[t].shift());S.pos[t]=S.hist[t].length-1;show();setLoad('');fill(t);
}
function prev(){const t=S.tab;if(S.pos[t]>0){S.pos[t]--;show()}}
function setLoad(s){$('#load').textContent=s}
function resetQueues(tab){S.queue[tab]=[];fill(tab)}

// ---------- render
const img=$('#img'),vid=$('#vid'),ov=$('#ov'),stage=$('#stage'),msg=$('#msg');
function media(){return vid.classList.contains('hidden')?img:vid}
function showErr(e){
  img.classList.add('hidden');vid.classList.add('hidden');vid.removeAttribute('src');ov.innerHTML='';
  msg.classList.remove('hidden');
  msg.innerHTML=`<b>연결 실패</b><br>${e}<br><span style="color:var(--tx3)">사이트가 외부 요청을 막았을 수 있음 → 설정에서 프록시 지정.<br>파일을 로컬(file://)로 열었다면 GitHub Pages 등 웹 주소로 열기.</span>`;
}
function show(){
  const t=S.tab,it=S.hist[t][S.pos[t]];resetTimer();
  if(!it){msg.classList.remove('hidden');msg.innerHTML='<b>불러오는 중</b>';return}
  msg.classList.add('hidden');
  if(it.kind==='vid'){
    img.classList.add('hidden');vid.classList.remove('hidden');
    vid.src=it.url;vid.onloadedmetadata=()=>{const d=vid.duration||0;
      if(!S.play&&d>0.3)vid.currentTime=0.1+Math.random()*(d-0.2);if(S.play)vid.play().catch(()=>{});else vid.pause();drawGrid()};
    vid.onerror=()=>showErr('영상 로드 실패');
  }else{
    vid.classList.add('hidden');vid.pause();vid.removeAttribute('src');img.classList.remove('hidden');
    img.onerror=()=>showErr('이미지 로드 실패 (핫링크 차단 가능)');img.src=it.url;
  }
  $('#info').innerHTML=`<span>${S.pos[t]+1}</span><span>${esc(it.title)}</span><a href="${it.link}" target="_blank" rel="noopener noreferrer">원본</a>`;
  applyView();
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function applyView(){
  const t=S.tab,f=S.tone==='color'?'':S.tone==='gray'?'grayscale(1)':`url(#${S.tone})`;
  img.style.filter=vid.style.filter=f;
  img.classList.toggle('flip',S.flip);vid.classList.toggle('flip',S.flip);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('#srcFilm').classList.toggle('hidden',t!=='film');$('#srcAnim').classList.toggle('hidden',t!=='anim');
  document.querySelectorAll('#tone button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.tone));
  document.querySelectorAll('#lc button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.lc));
  $('#flip').classList.toggle('on',S.flip);
  $('#grid').value=S.grid[t];$('#customBox').classList.toggle('hidden',S.grid[t]!=='custom');
  $('#op').value=S.op;$('#timer').value=S.timer;$('#onlyAnim').checked=S.onlyAnim;$('#tags').value=S.tags;$('#play').checked=S.play;
  $('#prev').disabled=S.pos[t]<=0;
  drawGrid();
}
function drawGrid(){
  ov.innerHTML='';const m=media();
  if(m.classList.contains('hidden')||!(m.naturalWidth||m.videoWidth))return;
  const r=m.getBoundingClientRect(),sr=stage.getBoundingClientRect(),w=r.width,h=r.height;
  Object.assign(ov.style,{left:(r.left-sr.left)+'px',top:(r.top-sr.top)+'px',width:w+'px',height:h+'px'});
  ov.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const mode=S.grid[S.tab];if(mode==='none')return;
  const c=S.lc;let s='';
  const L=(a,b,x,y,d)=>s+=`<line x1="${a}" y1="${b}" x2="${x}" y2="${y}" ${d?'stroke-dasharray="4 4"':''}/>`;
  const R=(x,y,ww,hh,d)=>s+=`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" fill="none" ${d?'stroke-dasharray="4 4"':''}/>`;
  const T=(x,y,t)=>s+=`<text x="${x}" y="${y}" font-size="9" fill="${c}" stroke="none" font-family="IBM Plex Mono">${t}</text>`;
  const cols=f=>f.forEach(p=>L(w*p,0,w*p,h)),rows=f=>f.forEach(p=>L(0,h*p,w,h*p));
  if(mode==='half'){cols([.5]);rows([.5])}
  if(mode==='thirds'){cols([1/3,2/3]);rows([1/3,2/3])}
  if(mode==='quarters'){cols([.25,.5,.75]);rows([.25,.5,.75])}
  if(mode==='golden'){const g=.381966;cols([g,1-g]);rows([g,1-g])}
  if(mode==='diag'){L(0,0,w,h);L(w,0,0,h);L(w/2,0,w/2,h,1);L(0,h/2,w,h/2,1)}
  if(mode==='custom'){const nc=+$('#gc').value||1,nr=+$('#gr').value||1;
    cols([...Array(nc-1)].map((_,i)=>(i+1)/nc));rows([...Array(nr-1)].map((_,i)=>(i+1)/nr))}
  if(mode==='field'){for(let k=1;k<=12;k++){const f=k/12;R(w*(1-f)/2,h*(1-f)/2,w*f,h*f,k%2);if(k%2===0&&k<12)T(w*(1-f)/2+3,h*(1-f)/2+11,k+'F')}
    L(w/2,0,w/2,h);L(0,h/2,w,h/2);L(0,0,w,h,1);L(w,0,0,h,1)}
  if(mode==='safe'){R(w*.05,h*.05,w*.9,h*.9);R(w*.1,h*.1,w*.8,h*.8,1);L(w/2-10,h/2,w/2+10,h/2);L(w/2,h/2-10,w/2,h/2+10);T(w*.05+4,h*.05+12,'ACTION 90%');T(w*.1+4,h*.1+12,'TITLE 80%')}
  ov.innerHTML=`<g stroke="${c}" stroke-width="1" opacity="${S.op/100}" shape-rendering="crispEdges">${s}</g>`;
}
img.addEventListener('load',drawGrid);vid.addEventListener('loadeddata',drawGrid);
new ResizeObserver(drawGrid).observe(stage);

// ---------- timer
let tLeft=0,tInt=null;
function resetTimer(){clearInterval(tInt);$('#timerBig').textContent='';if(!S.timer)return;tLeft=S.timer;showT();
  tInt=setInterval(()=>{tLeft--;if(tLeft<=0)next();else showT()},1000)}
function showT(){$('#timerBig').textContent=`${Math.floor(tLeft/60)}:${String(tLeft%60).padStart(2,'0')}`}

// ---------- events
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();
  if(S.pos[S.tab]<0)next();else show();applyView()});
$('#next').onclick=next;$('#prev').onclick=prev;
document.querySelectorAll('#tone button').forEach(b=>b.onclick=()=>{S.tone=b.dataset.v;save();applyView()});
document.querySelectorAll('#lc button').forEach(b=>b.onclick=()=>{S.lc=b.dataset.v;save();applyView()});
$('#grid').onchange=e=>{S.grid[S.tab]=e.target.value;save();applyView()};
$('#gc').oninput=$('#gr').oninput=drawGrid;
$('#op').oninput=e=>{S.op=+e.target.value;save();drawGrid()};
$('#flip').onclick=()=>{S.flip=!S.flip;applyView()};
$('#zen').onclick=()=>{document.body.classList.toggle('zen');setTimeout(drawGrid,0)};
stage.addEventListener('click',()=>{if(document.body.classList.contains('zen')){document.body.classList.remove('zen');setTimeout(drawGrid,0)}});
$('#timer').onchange=e=>{S.timer=+e.target.value;save();resetTimer()};
$('#onlyAnim').onchange=e=>{S.onlyAnim=e.target.checked;save();resetQueues('film')};
let tagT;$('#tags').oninput=e=>{S.tags=e.target.value;save();clearTimeout(tagT);tagT=setTimeout(()=>resetQueues('anim'),600)};
$('#tags').onkeydown=e=>{if(e.key==='Enter'){S.queue.anim=[];next()}};
$('#play').onchange=e=>{S.play=e.target.checked;save();if(!vid.classList.contains('hidden')){S.play?vid.play().catch(()=>{}):vid.pause()}};
$('#setBtn').onclick=()=>{$('#proxy').value=S.proxy;$('#setDlg').classList.remove('hidden')};
$('#setClose').onclick=()=>{S.proxy=$('#proxy').value.trim();save();$('#setDlg').classList.add('hidden');
  fg.total={};fg.animCat=undefined;S.queue={film:[],anim:[]};if(S.pos[S.tab]<0)next()};

const tones=['color','gray','t2','t3','t5'],grids=['none','half','thirds','quarters','golden','diag','custom','field','safe'];
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select'))return;const k=e.key.toLowerCase();
  if(k===' '||k==='arrowright'){e.preventDefault();next()}
  else if(k==='arrowleft')prev();
  else if(k==='g'){S.tone=tones[(tones.indexOf(S.tone)+1)%tones.length];save();applyView()}
  else if(k==='d'){const g=S.grid[S.tab];S.grid[S.tab]=grids[(grids.indexOf(g)+1)%grids.length];save();applyView()}
  else if(k==='f'){S.flip=!S.flip;applyView()}
  else if(k==='h')$('#zen').click();
  else if((k===','||k==='.')&&!vid.classList.contains('hidden')){vid.pause();vid.currentTime=Math.max(0,vid.currentTime+(k==='.'?1:-1)/24)}
});

applyView();next();setTimeout(()=>fill(S.tab==='film'?'anim':'film'),1500);
})();
</script>
</body>
</html>
